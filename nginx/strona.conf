# /etc/nginx/sites-available/strona.conf
# Podmień server_name i root, potem:
#   ln -s /etc/nginx/sites-available/strona.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# HTTPS najprościej dodać certbotem: certbot --nginx -d twoja-domena.pl

server {
    listen 80;
    listen [::]:80;
    server_name twoja-domena.pl www.twoja-domena.pl;

    root /var/www/strona;          # tu trafia zawartość folderu dist/
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # Pliki z hashem w nazwie (CSS, fonty) — można trzymać w cache bez końca
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
